<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Neumorphic Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF3F8" />
      <stop offset="100%" stop-color="#D9E0E8" />
    </linearGradient>

    <!-- Teal Glow Gradient -->
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FA8B5" />
      <stop offset="100%" stop-color="#31727D" />
    </linearGradient>

    <!-- Soft Inner Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 3D Shadow for Card -->
    <filter id="neuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.9" />
      <feDropShadow dx="16" dy="16" stdDeviation="20" flood-color="#B8C2CC" flood-opacity="0.6" />
    </filter>

    <!-- Embossed Element Shadow -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.8" />
      <feDropShadow dx="6" dy="6" stdDeviation="8" flood-color="#A6B2BD" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" fill="#E4E8EE" />

  <!-- Neumorphic Main Squircle Badge -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#bgGradient)" filter="url(#neuShadow)" />

  <!-- Ambient Teal Wave Aura -->
  <circle cx="210" cy="240" r="100" fill="#3B828E" opacity="0.08" filter="url(#softGlow)" />

  <!-- Concentric Soundwave Ripples -->
  <g stroke="url(#tealGradient)" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Ripple 1 (Inner Small) -->
    <path d="M 285 200 A 55 55 0 0 1 285 280" stroke-width="14" />
    
    <!-- Ripple 2 (Medium) -->
    <path d="M 325 170 A 95 95 0 0 1 325 310" stroke-width="16" />
    
    <!-- Ripple 3 (Outer Large) -->
    <path d="M 365 140 A 135 135 0 0 1 365 340" stroke-width="18" opacity="0.75" />
  </g>

  <!-- Letter 'g' Monogram (Modern Geometric Soft-Touch) -->
  <g filter="url(#emboss)">
    <!-- Main Loop (Top Circle of g) -->
    <circle cx="210" cy="216" r="62" fill="none" stroke="#FFFFFF" stroke-width="26" />
    
    <!-- Stem and Bottom Hook of g -->
    <path d="M 272 154 L 272 284 C 272 334 236 360 186 360 C 146 360 126 340 120 326" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="26" 
          stroke-linecap="round" />

    <!-- Inner Core Accent Dot -->
    <circle cx="210" cy="216" r="14" fill="url(#tealGradient)" opacity="0.9" />
  </g>
</svg>
